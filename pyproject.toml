[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devray-datalab-mcp"
version = "0.1.0"
description = "Local-first data science and machine learning MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DevRay DataLab" }]
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.9",
    "joblib>=1.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.10",
]

[project.scripts]
devray-datalab-mcp = "devray_datalab.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["devray_datalab*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
